<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Simran's Scrapbook</title>
<meta name="description" content="Simran Kaur Bedi, Frontend Engineer in Nagpur. Walk through a paper world with Vinie the beagle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Shantell+Sans:wght@400;600&family=Nunito:wght@400;700&family=Kalam:wght@300;400&display=swap">
<style>
/* Layout concept: a full-bleed paper diorama you walk through sideways, with scrapbook index tabs as the only fixed chrome. */
:root {
  --paper: #fff9ec; --sheet: #fffdf6; --ink: #2b2622; --muted: #6d6053; --line: #d8c8ae;
  --orange: #e87f1e; --on-orange: #2b2622; --kraft: #e9b872; --orange-ink: #b4530a; --rule: rgba(112,155,214,.32); --margin: rgba(232,86,86,.6); --marker: #ffe48a; --font-pen: "Kalam", "Comic Sans MS", cursive;
  --tab1: #eadca8; --tab2: #a8e6cf; --tab3: #a6c8f0; --tab4: #eba6a6; --tab5: #e8a4e0; --on-tab: #2b2622;
  --font-hand: "Gochi Hand", "Comic Sans MS", cursive;
  --font-marker: "Shantell Sans", "Comic Sans MS", cursive;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1f1d2e; --sheet: #2a2740; --ink: #f6eedf; --muted: #bdb2c6; --line: #4b4665;
  --orange: #f39a44; --kraft: #a97f49; --orange-ink: #ffb26b; --rule: rgba(160,175,230,.17); --margin: rgba(240,120,120,.45); --marker: #6a5a1e; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #1f1d2e; --sheet: #2a2740; --ink: #f6eedf; --muted: #bdb2c6; --line: #4b4665;
  --orange: #f39a44; --kraft: #a97f49; --orange-ink: #ffb26b; --rule: rgba(160,175,230,.17); --margin: rgba(240,120,120,.45); --marker: #6a5a1e; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; overflow: hidden; }
body.reading { overflow: auto; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

#world { position: fixed; inset: 0; }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c.dragging { cursor: grabbing; }
#c.hot { cursor: pointer; }
body.reading #world, body.reading #tabs, body.reading #hint { display: none; }

#bubble { position: fixed; left: 0; top: 0; width: max-content; max-width: min(380px, 84vw); padding: 12px 16px; background: var(--sheet); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 16px; font-family: var(--font-pen); font-size: 18px; line-height: 1.4;
  box-shadow: 4px 5px 0 rgba(43,38,34,.28); pointer-events: none; z-index: 5; }
#bubble::after { content: ""; position: absolute; left: 22px; bottom: -11px; width: 18px; height: 18px; background: var(--sheet); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); }
#bubble.below::after { bottom: auto; top: -11px; transform: rotate(225deg); }

#tools { position: fixed; z-index: 10; display: flex; gap: 8px;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }
.chip { padding: 4px 10px; background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; font-family: var(--font-marker); font-size: 14px; box-shadow: 2px 2px 0 var(--ink); }
.chip:active { transform: translate(2px, 2px); box-shadow: none; }

#tabs { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 2px; padding: 3px 6px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 12px; }
#tabs button { width: 36px; height: 34px; padding: 0; background: none; border: 0; border-radius: 8px; font-size: 19px; line-height: 1; }
#tabs button:hover { background: var(--paper); }
#tabs button[aria-current="true"] { background: var(--kraft); }

#hint { position: fixed; z-index: 4; left: 50%; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; padding: 6px 14px; background: var(--sheet); border: 2px dashed var(--ink); border-radius: 999px; font-family: var(--font-marker); font-size: 15px; white-space: nowrap; transition: opacity .4s; }
#hint.gone { opacity: 0; pointer-events: none; }

#loader { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--orange); color: var(--on-orange); font-family: var(--font-marker); text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); transition: opacity .6s; }
#loader.done { opacity: 0; pointer-events: none; }
#loader strong { font-family: var(--font-hand); font-size: clamp(36px, 8vw, 60px); font-weight: 400; line-height: 1.05; }
#bar { display: block; width: min(260px, 70vw); height: 10px; border: 2px solid var(--on-orange); border-radius: 8px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--on-orange); transition: width .2s; }

dialog#note { width: min(660px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); padding: 0; background: transparent; border: 0; overflow: visible; color: var(--ink); }
dialog#note::backdrop { background: rgba(38,34,48,.55); backdrop-filter: blur(3px); }
#noteBody { display: grid; gap: 10px; perspective: 1400px; }
.sheet { position: relative; box-sizing: border-box; max-height: calc(100dvh - 92px); overflow: auto; padding: 34px clamp(18px, 4vw, 38px) 28px clamp(44px, 9vw, 74px); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 8px 9px 0 rgba(30,26,40,.4);
  background-color: var(--sheet); background-image: linear-gradient(90deg, transparent calc(clamp(34px, 7vw, 58px) - 1px), var(--margin) calc(clamp(34px, 7vw, 58px) - 1px), var(--margin) clamp(34px, 7vw, 58px), transparent clamp(34px, 7vw, 58px)), repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); background-attachment: local; transform-origin: left center; }
.sheet.drop { animation: note-drop .42s cubic-bezier(.2,1.25,.4,1); }
.sheet.next { animation: note-next .42s ease-out; }
.sheet.prev { animation: note-prev .42s ease-out; }
.sheet > * { animation: note-rise .4s both; }
.sheet > *:nth-child(2) { animation-delay: .05s; } .sheet > *:nth-child(3) { animation-delay: .1s; } .sheet > *:nth-child(4) { animation-delay: .16s; } .sheet > *:nth-child(5) { animation-delay: .22s; } .sheet > *:nth-child(6) { animation-delay: .28s; }
@keyframes note-drop { from { transform: translateY(-46px) rotate(-3deg) scale(.95); opacity: 0; } }
@keyframes note-next { from { transform: rotateY(-62deg); opacity: .2; } }
@keyframes note-prev { from { transform: rotateY(38deg) translateX(-30px); opacity: .2; } }
@keyframes note-rise { from { transform: translateY(12px); opacity: 0; } }
.sheet h2 { margin: 0 52px 4px 0; font-family: var(--font-hand); font-weight: 400; font-size: clamp(32px, 6vw, 42px); line-height: 1.05; text-wrap: balance; }
.sheet p, .sheet ul { margin: 6px 0; font-size: 17px; line-height: 32px; }
.kicker { margin: 0 0 6px !important; color: var(--orange-ink); font-size: 13px !important; line-height: 1.4 !important; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.mascot { position: absolute; top: 14px; right: 58px; width: 46px; height: 46px; padding: 0; background: var(--paper); border: 2px solid var(--ink); border-radius: 50%; font-size: 24px; line-height: 1; transition: transform .15s; }
.mascot:hover { transform: rotate(-12deg) scale(1.12); }
#close { position: absolute; z-index: 2; top: 14px; right: 14px; width: 38px; height: 38px; padding: 0; background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); border-radius: 50%; font-size: 16px; line-height: 1; }
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 4px; }
.pager button.arrow { min-width: 44px; height: 38px; background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; font-family: var(--font-hand); font-size: 22px; line-height: 1; box-shadow: 2px 2px 0 var(--ink); }
.pager button.arrow:active { transform: translate(2px, 2px); box-shadow: none; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-width: 0; }
.dots button { width: 12px; height: 12px; padding: 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 50%; transition: transform .15s; }
.dots button[aria-current="true"] { background: var(--orange); transform: scale(1.3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.chipbtn { padding: 4px 12px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; font-family: var(--font-pen); font-size: 16px; transition: transform .15s, background .15s; }
.chipbtn:hover { transform: translateY(-2px) rotate(-1deg); }
.chipbtn[aria-pressed="true"], .chipbtn[aria-selected="true"] { background: var(--orange); color: var(--on-orange); }
.hl { padding: 0 3px; border-radius: 3px; background-image: linear-gradient(var(--marker), var(--marker)); background-repeat: no-repeat; background-size: 0 100%; transition: background-size .45s ease; }
.hl.lit { background-size: 100% 100%; }
.pane { animation: note-rise .3s both; }
.pane h3 { margin: 12px 0 2px; font-family: var(--font-hand); font-weight: 400; font-size: 24px; }
.sticker { display: inline-block; padding: 6px 14px; background: var(--paper); color: var(--ink); border: 2px dashed var(--ink); border-radius: 8px; font-family: var(--font-pen); font-size: 17px; transition: transform .15s; }
.sticker:nth-child(odd) { transform: rotate(-2deg); } .sticker:nth-child(even) { transform: rotate(2deg); }
.sticker.wob { animation: wob .5s; }
@keyframes wob { 25% { transform: rotate(-9deg) scale(1.1); } 60% { transform: rotate(8deg) scale(1.06); } }
.years { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.eduPanel { margin-top: 10px; }
.eduPanel strong { font-family: var(--font-hand); font-weight: 400; font-size: 27px; line-height: 1.15; display: block; }
.stamps { display: grid; gap: 12px; margin-top: 12px; }
.stampbtn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 14px; text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; font-size: 16px; line-height: 1.35; }
.stampbtn > span:last-child { min-width: 0; }
.seal { flex: 0 0 auto; display: grid; place-items: center; width: 44px; height: 44px; border: 3px dashed var(--muted); border-radius: 50%; color: transparent; font-size: 22px; }
.stampbtn[aria-pressed="true"] .seal { border: 3px solid var(--orange-ink); color: var(--orange-ink); animation: stamp .3s; }
@keyframes stamp { from { transform: scale(2.2) rotate(-20deg); opacity: 0; } }
.tagline { display: inline-block; padding: 2px 12px; background: var(--marker); color: var(--ink); border-radius: 4px; font-family: var(--font-hand); font-size: 21px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.chip { display: inline-block; text-decoration: none; }
.stamp { background: var(--orange); color: var(--on-orange); }
.postcard { position: relative; display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 10px; }
.postcard > * { min-width: 0; }
.postcard label { display: block; margin-top: 6px; font-size: 14px; font-weight: 700; }
.postcard input, .postcard textarea { width: 100%; box-sizing: border-box; padding: 7px 10px; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; font-family: var(--font-pen); font-size: 16px; }
.postcard textarea { min-height: 96px; resize: vertical; }
.addr p { margin: 0; font-size: 16px; line-height: 28px; overflow-wrap: anywhere; }
.postmark { width: 74px; height: 88px; margin-bottom: 10px; display: grid; place-items: center; background: var(--orange); color: var(--on-orange); border: 3px dotted var(--ink); font-family: var(--font-hand); font-size: 15px; text-align: center; line-height: 1.05; transform: rotate(4deg); }
.postmark.done { animation: stamp .35s; background: var(--marker); }
#status { font-size: 16px; line-height: 1.4; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
@media (min-width: 560px) { .postcard { grid-template-columns: 1.25fr 1fr; } .addr { border-left: 2px dashed var(--line); padding-left: 18px; } }

/* plain page */
#page { box-sizing: border-box; max-width: 1040px; margin: 0 auto; padding-block: 72px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { display: grid; gap: 22px; padding: clamp(24px, 5vw, 48px); padding-left: clamp(44px, 8vw, 92px); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 7px 8px 0 var(--line);
  background-color: var(--sheet); background-image: linear-gradient(90deg, transparent calc(clamp(32px, 6vw, 70px) - 1px), var(--margin) calc(clamp(32px, 6vw, 70px) - 1px), var(--margin) clamp(32px, 6vw, 70px), transparent clamp(32px, 6vw, 70px)), repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); }
.hero > * { min-width: 0; }
.hero h1 { margin: 0; font-family: var(--font-hand); font-weight: 400; font-size: clamp(50px, 10vw, 92px); line-height: .98; text-wrap: balance; }
.hero .role { margin: 8px 0 0; display: inline-block; padding: 2px 12px; background: var(--marker); border-radius: 4px; font-family: var(--font-pen); font-size: clamp(18px, 3vw, 22px); }
.hero .lede { max-width: 62ch; margin: 18px 0 0; font-size: 18px; line-height: 32px; }
.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; padding: 8px 0; background: var(--paper); }
.jump button { padding: 4px 12px; background: none; color: var(--ink); border: 2px solid transparent; border-radius: 8px; font-family: var(--font-hand); font-size: 21px; }
.jump button:hover { border-color: var(--ink); }
.columns { display: grid; gap: 34px; grid-template-columns: 1fr; margin-top: 8px; }
.columns > * { min-width: 0; }
@media (min-width: 860px) { .columns { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); } .hero { grid-template-columns: 1fr; } }
#page h2 { margin: 34px 0 14px; font-family: var(--font-hand); font-weight: 400; font-size: 36px; line-height: 1.05; }
#page section:first-child h2 { margin-top: 10px; }
#page p { margin: 6px 0; }
.job { padding: 18px 20px; margin-bottom: 16px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 10px; }
.job h3 { margin: 0; font-family: var(--font-hand); font-weight: 400; font-size: 29px; line-height: 1.1; }
.job .cat { margin: 2px 0 10px; color: var(--orange-ink); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.job .tags, .skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { padding: 2px 10px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; font-size: 14px; }
.job .impact { margin-top: 10px; }
.job .impact b { background: var(--marker); padding: 0 5px; border-radius: 3px; font-weight: 700; }
.valgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }
.val { padding: 14px 16px; background: var(--sheet); border: 2px dashed var(--line); border-radius: 10px; }
.val b { display: block; font-family: var(--font-hand); font-weight: 400; font-size: 23px; line-height: 1.12; }
.val i { color: var(--orange-ink); font-style: normal; font-size: 14px; }
.val p { font-size: 15px; line-height: 1.5; }
.timeline { position: relative; padding-left: 22px; border-left: 3px solid var(--orange); }
.timeline > div { position: relative; margin-bottom: 16px; }
.timeline > div::before { content: ""; position: absolute; left: -31px; top: 4px; width: 13px; height: 13px; background: var(--sheet); border: 3px solid var(--orange); border-radius: 50%; }
.timeline b { display: block; line-height: 1.3; }
.timeline small { color: var(--muted); font-size: 14px; display: block; }
.certs { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.certs li { display: flex; gap: 8px; }
.certs li::before { content: "✓"; color: var(--orange-ink); font-weight: 700; }
.contactcard { padding: 16px 18px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 10px; overflow-wrap: anywhere; }
.contactcard p { margin: 2px 0; }
#page a { color: inherit; text-decoration-color: var(--orange); text-decoration-thickness: 2px; }
#page footer { margin-top: 44px; color: var(--muted); font-size: 14px; }

@media (max-width: 720px), (max-height: 520px) {
  #tabs { padding: 2px 3px; }
  #tabs button { width: min(9.6vw, 36px); font-size: 17px; }
}
html.fancy, html.fancy * { cursor: none !important; }
html.fancy input, html.fancy textarea { cursor: text !important; }
#paw { position: fixed; left: 0; top: 0; z-index: 60; width: 0; height: 0; pointer-events: none; }
#paw svg { position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; transform: rotate(-18deg); transition: transform .16s cubic-bezier(.2,1.5,.4,1); filter: drop-shadow(1px 2px 0 rgba(43,38,34,.3)); }
#paw b { position: absolute; left: 22px; top: 12px; padding: 1px 9px; background: var(--ink); color: var(--paper); border-radius: 999px; font-family: var(--font-hand); font-size: 16px; font-weight: 400; white-space: nowrap; opacity: 0; transform: scale(.6); transform-origin: left center; transition: opacity .12s, transform .16s; }
#paw.hot svg { transform: rotate(10deg) scale(1.4); }
#paw.hot b { opacity: 1; transform: scale(1); }
#paw.press svg { transform: rotate(0) scale(.8); }
#paw.gone { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="bubble" hidden></div>
<div id="tools">

    if (nowPlace !== place) { place = nowPlace; setCostume(PLACES[place].id); spin = 1; poof.visible = !calm; }
    const pid = PLACES[place].id;
    spin = Math.max(0, spin - dt * 1.2);
    vinie.position.x = x; vinie.rotation.y = flip + (calm ? 0 : (1 - spin) * (spin > 0 ? 6.283 : 0));
    balloons.visible = g > .03; balloons.scale.setScalar(Math.max(.001, g));
    if (poof.visible) { const q = 1 - spin; poof.position.set(x, 2.4 + g * 2, 5.3); poof.scale.setScalar(.4 + q * 1.7); poof.rotation.z = q * 2; if (spin <= 0 || q > .55) poof.visible = false; }
    if (rig.wheels) rig.wheels.forEach(w => { w.rotation.z = -phase * .55; });
    if (rig.cape) rig.cape.rotation.z = .02 + amp * .28 + Math.sin(t * 5) * .05 * (.4 + amp);
    hop = Math.max(0, hop - dt * 2.4);
    const stride = pid === "space" ? Math.abs(Math.sin(phase * .5)) * .75 * amp : pid === "nagpur" ? Math.sin(t * 34) * .012 * amp : Math.abs(Math.sin(phase)) * .1 * amp;
    vinie.position.y = .03 + stride + Math.sin(hop * Math.PI) * .55 + g * 2.7 + (calm ? 0 : g * Math.sin(t * 2) * .13);
    const sw = Math.sin(phase) * .62 * amp * (1 - g) + g * Math.sin(t * 3) * .22;
    rig.nearF.rotation.z = sw; rig.farB.rotation.z = sw * .9; rig.nearB.rotation.z = -sw; rig.farF.rotation.z = -sw * .9;
    rig.body.rotation.z = Math.sin(phase * 2) * .025 * amp;
    rig.head.rotation.z = (calm ? 0 : Math.sin(t * 1.6) * .03) + Math.sin(phase * 2) * .05 * amp;
    rig.ear.rotation.z = Math.sin(phase * 2 + 1) * .2 * amp + (calm ? 0 : Math.sin(t * 2.1) * .03);
    rig.tail.rotation.z = .22 + (calm ? 0 : Math.sin(t * (amp > .15 ? 15 : 8)) * .3);

    camG += (g - camG) * (1 - Math.exp(-dt * 1.3));
    const aim = x + aheadX; camX += (aim - camX) * (calm ? 1 : 1 - Math.exp(-dt * 4));
    smx += (mx - smx) * .05; smy += (my - smy) * .05;
    const par = calm ? 0 : 1;
    const nowY = lookY + camG * 1.1, nowD = camDist;
    cam.position.set(camX - 1.05 + smx * .42 * par, nowY + 1 - smy * .22 * par, nowD);
    cam.lookAt(camX, nowY, 1.5);

    const snap = Math.round(camX / texel) * texel;
    sun.position.set(snap - 5, 15, 17); sun.target.position.set(snap, 2, 2);
    lantern.position.set(x + 1, 3.2, 6.5);

    const nearest = b => b + Math.round((camX - b) / LOOP) * LOOP;
    for (const m of islandParts) { if (m.userData.bx === undefined) m.userData.bx = m.position.x; m.position.x = nearest(m.userData.bx); }
    const vis = half + 7;
    for (const m of all) {
      const u = m.userData; m.position.x = nearest(u.x0); const far = Math.abs(m.position.x - camX) > vis;
      m.visible = !far; if (far) { if (u.pop) u.s = 0; continue; }
      if (u.pop) {
        const want = Math.abs(m.position.x - camX) < half + 2.5 ? 1 : 0;
        u.vel = (u.vel || 0) + ((want - u.s) * 90 - (u.vel || 0) * 11) * dt; u.s = Math.max(-.05, u.s + u.vel * dt);
        m.rotation.x = -(1 - u.s) * 1.5;
      }
      let rz = u.rz;
      if (u.spin) rz += t * u.spin;
      if (u.sway) rz += Math.sin(t * 1.3 + u.ph) * u.sway;
      if (u.kick) { u.kick = Math.max(0, u.kick - dt * 1.2); rz += Math.sin(u.kick * 16) * .22 * u.kick; }
      m.rotation.z = rz;
      const up = m === hot ? 1 : 0; u.hot += (up - u.hot) * .2;
      if (up && !u.base) u.base = m.scale.clone();
      if (u.base) { m.scale.copy(u.base).multiplyScalar(1 + u.hot * .07); if (!calm) m.rotation.z += Math.sin(t * 8) * .018 * u.hot; }
      m.position.z = u.baseZ + u.hot * .38;
    }
    liveWorld(t, dt);
    updateTabs();
    if (!bubble.hidden) {
      if (bubbleUntil && now > bubbleUntil) hideBubble();
      if (bubbleAnchor) headPos.copy(bubbleAnchor); else headPos.set(x + 1, 2.6, 5);
      headPos.project(cam);
      const bw = bubble.offsetWidth, bh = bubble.offsetHeight, sx = (headPos.x + 1) / 2 * innerWidth, sy = (1 - headPos.y) / 2 * innerHeight;
      const lx = Math.max(12, Math.min(innerWidth - bw - 12, sx - 30)), ly = bubbleAnchor ? Math.min(innerHeight - bh - 70, sy + 16) : Math.max(58, sy - bh - 16);
      bubble.style.transform = `translate(${lx}px, ${ly}px)`;
    }
    gl.render(scene, cam);
  }
  const api = {
    jump(i) { hideBubble(); jumping = true; let a = PLACES[i].at; [a - LOOP, a + LOOP].forEach(k => { if (Math.abs(k - x) < Math.abs(a - x)) a = k; }); tx = a; if (!moved) { moved = true; $("hint").classList.add("gone"); } },
    setPaused(p) { paused = p; cancelAnimationFrame(raf); if (!p) { prev = performance.now(); raf = requestAnimationFrame(frame); } },
    setNight(n) {
      ambient.color.set(n ? "#8d92c9" : "#ffffff"); ambient.intensity = n ? 1.45 : 2.4;
      sun.intensity = n ? .3 : 1; lantern.intensity = n ? 9 : 0;
      const c = n ? "#b8bcdd" : "#ffffff"; tinted.forEach(m => m.color.set(c));
      scene.background = sky.set(n ? "#262646" : "#fbfaf4");
    },
    start() { prev = performance.now(); raf = requestAnimationFrame(frame); }
  };
  return api;
}

(async () => {
  if (!window.THREE) return bail();
  try {
    world = await buildWorld();
    world.start();
    syncTheme();
    $("loader").classList.add("done");
    setTimeout(() => say("Hi! I'm Vinie. Scroll or drag and I'll show you around!", 5000), 700);
  } catch (err) { console.error(err); bail(); }
})();
</script>
